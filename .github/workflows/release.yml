name: release

# Bump `version:` in pubspec.yaml, then push a matching tag, e.g.
#   git tag v0.1.0 && git push origin v0.1.0
#
# APKs are signed with the key in these repository secrets, if set:
#   ANDROID_KEYSTORE_BASE64  base64 of the .jks file
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Without them they are signed with a throwaway debug key (installable, but
# a later properly signed build won't install over it without uninstalling).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build, e.g. v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check tag matches the pubspec version
        run: |
          version=$(sed -nE 's/^version: ([0-9.]+).*/\1/p' pubspec.yaml)
          echo "pubspec version: $version, tag: $TAG"
          test "v$version" = "$TAG" || { echo "::error::Tag $TAG does not match pubspec version $version"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Test
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::No signing secrets; the APKs are signed with a debug key"
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > android/key.properties <<PROPS
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - name: Build APKs
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release
          mkdir dist
          cd build/app/outputs/flutter-apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp app-$abi-release.apk ../../../../dist/todomd-$TAG-$abi.apk
          done
          cp app-release.apk ../../../../dist/todomd-$TAG-universal.apk
          ls -la ../../../../dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
          files: dist/*.apk
